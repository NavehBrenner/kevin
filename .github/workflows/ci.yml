name: CI

# Gate every PR into master on type checks + tests. Runs on the PR branch,
# which carries the scenegen extra, so the CAD geometry tests run for real
# (rather than being skipped via importorskip).
on:
  pull_request:
    branches: [master]

jobs:
  check:
    # Pinned, not `ubuntu-latest`: the same discipline the dependencies follow. An
    # implicit image means GitHub's migration schedule picks our OS — `ubuntu-latest`
    # moves to Ubuntu 26 on 2026-10-19. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags after v7, so this is an exact
      # version rather than a major — which suits the pinning policy anyway.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python + dependencies
        run: |
          uv sync --all-extras

      # Same tasks the local `poe check` runs, so CI and dev share one definition.
      - name: Lint (ruff)
        run: uv run poe lint

      - name: Format check (ruff)
        run: uv run poe fmt-check

      - name: Type check (mypy)
        run: uv run poe typecheck

      - name: Structural rules (qualety)
        run: uv run poe structure

      - name: Tests (pytest)
        run: uv run poe test
